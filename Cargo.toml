[package]
name = "pve-dev"
version = "0.1.0"
edition = "2024"
default-run = "pve-devctl"
description = "Hearth: a multi-user Proxmox control plane"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
redb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
